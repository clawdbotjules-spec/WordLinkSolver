name: build

on:
  push:
  pull_request:

jobs:
  # Solver + dictionary tests are pure stdlib Python: fast Linux signal.
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile wordlink_solver.py hud.py app.py build_game_dictionary.py
      - name: CLI smoke test
        run: python3 wordlink_solver.py OTNIFPSNORAGNOAY --limit 10

  # The real target platform: compile the Vision OCR helper and run the same
  # tests on macOS.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swiftc -O fast_ocr.swift -o fast_ocr
      - run: ./fast_ocr 2>err.txt || grep -q "usage:" err.txt  # arg validation works
      - run: python3 -m unittest discover -s tests -v
      - run: python3 wordlink_solver.py OTNIFPSNORAGNOAY --limit 10
      - uses: actions/upload-artifact@v4
        with:
          name: fast_ocr
          path: fast_ocr
